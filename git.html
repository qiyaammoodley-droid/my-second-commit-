<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        header {
            background: black;
            color: white;
            padding: 20px;
        }

        main {
            padding: 40px;
        }

        button {
            padding: 10px 20px;
            border: none;
            background: black;
            color: white;
            cursor: pointer;
            border-radius: 8px;
        }

        button:hover {
            background: #333;
        }
    </style>
</head>

<body>

    <header>
        <h1>Welcome to My Website</h1>
    </header>

    <main>
        <h2>Hello World 🌍</h2>
        <p>This is my first HTML draft.</p>

        <button onclick="showMessage()">
            Click Me
        </button>
    </main>

    <script>
        function showMessage() {
            alert("You clicked the button! 🚀");
        }
    </script>

</body>
</html>
